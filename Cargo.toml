[package]
name = "termostato"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Guarda o calor da fedora (MacBookPro11,2): limite de potência da CPU, freio de calor, ventoinhas e métricas para o Prometheus"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Prosa em português cita nomes (MacBook, PL1) que a regra quer entre crases.
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
