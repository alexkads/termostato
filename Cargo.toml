[package]
name = "termostato"
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
description = "Guarda o calor da fedora (MacBookPro11,2): limite de potência da CPU, freio de calor, ventoinhas e métricas para o Prometheus"
publish = false

# O termostato e as checagens (`cargo xtask`, #28). O painel tem workspace
# próprio: fixa o RavenRS num commit e compila para wasm.
[workspace]
members = [".", "xtask"]
exclude = ["painel"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rustix = { version = "1", features = ["event", "fs"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Prosa em português cita nomes (MacBook, PL1) que a regra quer entre crases.
doc_markdown = "allow"
# Nos testes, c (config), d (pasta), f (freio)… são a convenção mais legível.
many_single_char_names = "allow"
assert_is_empty = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Os testes rodam muitas vezes e as dependências compilam uma vez: elas vão
# otimizadas e nada leva debuginfo (guia de desempenho de build do Cargo).
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
