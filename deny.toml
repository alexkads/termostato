# O `cargo deny check` do `cargo xtask release` (#28), para os dois workspaces:
# o da raiz e o do painel (`--manifest-path painel/Cargo.toml`).

[advisories]
# Avisos de segurança e crates sem manutenção falham; os ignorados vão aqui, com o motivo.
ignore = []

[licenses]
# As licenças livres que as dependências usam hoje. Uma nova entra aqui de propósito.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# O termostato, o xtask e o painel têm `publish = false`.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# O painel fixa o RavenRS num commit.
allow-git = ["https://github.com/alexkads/RavenRS"]
