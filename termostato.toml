# Configuração do termostato. Instalado em /etc/termostato.toml; depois de
# mudar, `sudo systemctl restart termostato`. Linha apagada = valor padrão.

# Potência sustentada da CPU (RAPL PL1), em watts. O firmware da Apple deixa
# 100 W, que é sem limite. Desça para 32 se ainda esquentar; suba para 42 se
# sobrar folga. O turbo curto (PL2, 125 W) fica livre: a arrancada não muda.
pl1_normal_w = 38

# A curva de freio, com previsão do pico. A CPU nunca fica solta: sem calor,
# vale o pl1_normal_w. A cada leitura, uma reta pelas últimas `janela_leituras`
# temperaturas prevê onde a CPU estará daqui a `previsao_s`; o PL1 sai da curva
# aplicada à maior entre a de agora e a prevista:
#   até `freio_comeca_c`            → pl1_normal_w
#   entre os dois, em linha reta     → do normal até o freio
#   a partir de `freio_acima_c`     → pl1_freio_w
# Frear é na hora; soltar sobe no máximo `subida_w_por_s` watts por segundo.
pl1_freio_w = 25
freio_comeca_c = 80
freio_acima_c = 92
janela_leituras = 5
previsao_s = 10
subida_w_por_s = 0.5

# Alvo de temperatura (°C): segura a CPU nele, baixando o PL1 até pl1_minimo_w.
# 0 = sem alvo, só a curva. Na hora, sem editar aqui: `sudo termostato CPU50C`.
alvo_c = 0
pl1_minimo_w = 8
alvo_ganho_w_por_c_s = 0.5

# Segundos entre leituras.
intervalo_s = 2

# "curva": o piso acompanha a temperatura média (de ventoinhas_suavizacao_s),
# para uma arrancada curta do turbo não acelerar o cooler. Fica no mínimo até
# ventoinhas_calma_ate_c, sobe em linha reta e chega ao máximo em
# ventoinhas_maximo_em_c. Desce devagar. "maximo": o piso fica sempre no máximo (mais barulho, picos
# um pouco menores). "automatico": o applesmc decide sozinho.
ventoinhas = "curva"
ventoinhas_calma_ate_c = 60
ventoinhas_maximo_em_c = 80
ventoinhas_minimo_rpm = 2000
ventoinhas_descida_rpm_por_s = 50
ventoinhas_suavizacao_s = 20

# Onde o Prometheus lê. Só no loopback: o serviço roda como root.
escuta = "127.0.0.1:9101"

# ── A conversa com o kernel e o chip (0.6) ─────────────────────────────────

# O TCC offset: a própria CPU se freia `tcc_offset_c` graus antes do TjMax
# (100 °C), sem software no meio. 8 = 92 °C. 0 deixa o de fábrica. Gravado
# pelo driver msr do kernel a cada subida (o chip o zera no boot).
tcc_offset_c = 8

# O gatilho de pressão: o kernel acorda o termostato quando, numa janela de
# `psi_janela_ms`, algum processo fica `psi_parado_ms` parado esperando memória.
# A janela vai de 500 a 10.000 ms. 0 desliga.
psi_parado_ms = 150
psi_janela_ms = 1000

# ── Os superpoderes ────────────────────────────────────────────────────────

# Os processos: observar quem gasta CPU, aprender quem esquenta (o histórico
# negativo, em /var/lib/termostato/historico.json) e frear antes quando um
# suspeito volta a gastar CPU.
[processos]
aprender = true
antecipar = true
suspeito_c_s = 1.0          # nota de calor (°C/s) a partir da qual é suspeito
minimo_de_observacoes = 3   # observações de calor antes de virar suspeito
fatia_minima = 0.05         # fatia da CPU da máquina (0 a 1) para contar
esquecer_dias = 30
ignorar = ["termostato"]

# As mãos: segurar CPU (cpu.max, ou o Docker pelos NanoCpus) e memória
# (memory.high) no cgroup de quem abusa, e devolver quando a máquina se acalma.
# Ninguém é morto. "observar" (o padrão) só mostra no journal e no Grafana o
# que faria; "agir" faz; "desligado" nem observa.
[maos]
modo = "observar"
cpu_a_partir_de = 0.3       # intensidade do freio (0 a 1) que começa a segurar a CPU
minimo_cpus = 1.0           # nenhum cgroup fica com menos núcleos que isto
memoria_aperto_pct = 10.0   # pressão de memória (PSI some avg10, %) que segura memória
memoria_folga_pct = 2.0     # abaixo disto, por `calmo_s`, os limites voltam
calmo_s = 60
fatia_minima = 0.2
nunca = [
  "/init.scope", "/system.slice/termostato.service", "/system.slice/sshd.service",
  "/system.slice/systemd-", "/system.slice/tailscaled.service",
  "/system.slice/docker.service", "/system.slice/containerd.service",
  "monitoramento-", "testcontainers-ryuk-",
]

# Cada intervenção vira uma anotação no Grafana. O token (de uma conta de
# serviço com permissão de anotar) fica num arquivo com modo 600.
[grafana]
url = ""                    # ex.: "http://grafana.local:3000"; vazio = sem anotações
token_arquivo = "/etc/termostato/grafana.token"

# A caixa-preta: a cada leitura, uma linha com o que explica um travamento
# (cada núcleo, motivos do freio do chip, bateria, swap, OOM e quem segura a
# memória), em /var/lib/termostato/caixa-preta/. Depois de uma queda, o boot
# seguinte escreve 💥 no journal e no Grafana com a última leitura.
[caixa_preta]
horas = 24                  # quantas horas ficam guardadas (1 a 168)
mb_max = 50                 # teto de espaço, em MB (1 a 2000)
