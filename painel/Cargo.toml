# O painel do termostato: um app RavenRS para o navegador (WebGL2), embutido no
# binário do termostato. Workspace próprio: o RPM do termostato não compila isto,
# usa o que `cargo xtask painel` deixou em `dist/`.
[package]
name = "painel"
version = "0.8.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fixado num commit do master do RavenRS: o do design system do RCB mais o
# FlowCanvas::pan_with_wheel (alexkads/RavenRS#791).
ravenrs = { git = "https://github.com/alexkads/RavenRS", rev = "c5dd076832863f9c5393b61f6c32d3af3a91e92b", default-features = false, features = ["charts", "flow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# O mesmo do RavenRS: o `wasm-bindgen` da linha de comando tem de bater.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Como no workspace da raiz: dependências otimizadas e sem debuginfo, porque os
# testes desenham a página inteira muitas vezes e o RavenRS compila uma vez.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1
