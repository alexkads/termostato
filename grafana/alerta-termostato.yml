apiVersion: 1

# Usa o ponto de contato que já existe no monitoramento da fedora
# (email-pelo-carteiro, em temperatura.yml).
groups:
  - orgId: 1
    name: termostato
    folder: Fedora
    interval: 30s
    rules:
      - uid: termostato-parado
        title: Termostato parado (sem métricas por 2 min)
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { gravidade: critica }
        annotations:
          summary: "O termostato da fedora não responde: a CPU está sem limite de potência e sem freio de calor."
          description: "Veja `systemctl status termostato` e `journalctl -u termostato -n 50`. O systemd o reinicia sozinho (Restart=always); parado por 2 min quer dizer que ele cai ao subir."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              expr: 'max(up{job="termostato"})'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [ { evaluator: { type: lt, params: [1] } } ]

      - uid: termostato-freio-longo
        title: Freio de calor acionado há mais de 10 min
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { gravidade: aviso }
        annotations:
          summary: "A CPU da fedora passa de 92 °C mesmo com o PL1 em 38 W: o freio segura há 10 minutos."
          description: "Com o limite de potência no lugar, isso indica ventoinha parada ou poeira nas aletas. Veja o painel Termostato (ventoinhas) e baixe `pl1_normal_w` em /etc/termostato.toml se for carga normal."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'max(termostato_freio_acionado)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [ { evaluator: { type: gt, params: [0] } } ]

      - uid: termostato-agiu
        title: O termostato segurou um processo ou contêiner
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { gravidade: aviso }
        annotations:
          summary: "As mãos do termostato agiram na fedora: limitaram CPU ou memória de algum processo ou contêiner (ou devolveram o limite)."
          description: "O que foi feito está nas marcas do painel Termostato e em `journalctl -u termostato | grep 🤚`. Para desfazer à mão: `[maos] modo = \"observar\"` em /etc/termostato.toml e `sudo systemctl restart termostato` (ao parar, ele devolve tudo)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'sum(increase(termostato_acoes_total{acao=~"segurar_cpu|segurar_memoria|devolver"}[5m]))'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [ { evaluator: { type: gt, params: [0] } } ]

      - uid: termostato-memoria
        title: Pressão de memória alta na fedora (mais de 20 % por 2 min)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { gravidade: critica }
        annotations:
          summary: "Processos da fedora passam mais de 20 % do tempo parados esperando memória: é o caminho do travamento de 19/11/2026."
          description: "Veja no painel Termostato quem está gastando. Compilação com muitos jobs (CARGO_BUILD_JOBS acima de 2), a VM Windows e os contêineres do e2e juntos não cabem em 16 GB."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              expr: 'max(termostato_pressao_pct{recurso="memoria",tipo="some"})'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [ { evaluator: { type: gt, params: [20] } } ]

      - uid: termostato-bateria-no-carregador
        title: A bateria descarrega com o carregador ligado há mais de 10 min
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { gravidade: aviso }
        annotations:
          summary: "A bateria da fedora descarrega mesmo com o carregador ligado: ele não dá conta da carga."
          description: "Visto em 22/11/2026 a partir de ~17 W de CPU. Confira se o carregador é o MagSafe 2 de 85 W. Com a bateria vazia, o SMC pode frear a CPU por fora (PROCHOT): veja o painel 'Por que o chip está freado'."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'max(termostato_bateria_amperes < -0.1 and on() termostato_carregador_ligado == 1) or on() vector(0)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [ { evaluator: { type: lt, params: [-0.1] } } ]
